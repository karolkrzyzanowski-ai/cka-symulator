name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Zależności
        run: npm ci

      - name: Testy symulatora (wszystkie zadania i warianty)
        run: npm test

      - name: Budowanie aplikacji webowej
        run: npm run build

      - name: Synchronizacja z projektem Androida
        run: npx cap sync android

      - name: Budowanie APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/cka-symulator.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cka-symulator-apk
          path: cka-symulator.apk

      - name: Wydanie (Releases)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CKA Symulator 1.0.${{ github.run_number }}
          make_latest: true
          files: cka-symulator.apk
          body: |
            APK do instalacji na Androidzie (7.0+): pobierz `cka-symulator.apk` poniżej i otwórz na telefonie.
            Commit: ${{ github.sha }}
